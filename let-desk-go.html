  <p>Opening Let Desk&hellip;</p>
  <a href="https://desk.northhillsbrief.com/preview">Go to Let Desk now</a>
</main>
<script>
  // Tracked short link hop (29 Sep 2026). Cloudflare Web Analytics counts this
  // page under its short path (for example /desk-beattie), then the visitor is
  // sent on to the Let Desk sample board. The short wait gives the analytics
  // beacon time to load before the page is left.
  (function () {
    var dest = "https://desk.northhillsbrief.com/preview";
    function go() { window.location.replace(dest); }
    if (document.readyState === "complete") { setTimeout(go, 800); }
    else { window.addEventListener("load", function () { setTimeout(go, 800); }); }
    setTimeout(go, 3000);
  })();
</script>
